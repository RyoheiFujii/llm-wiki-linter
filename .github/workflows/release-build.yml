name: release build

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '20'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write      # Sigstore短命証明書発行用
      attestations: write  # GitHub Attestation Store書き込み用
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Package artifacts
        run: |
          mkdir -p release
          TAR_NAME="llm-wiki-linter-${GITHUB_REF_NAME}.tar.gz"
          # 存在するファイルのみを対象にアーカイブ化
          TARGETS="dist package.json"
          [ -f package-lock.json ] && TARGETS="${TARGETS} package-lock.json"
          [ -f README.md ] && TARGETS="${TARGETS} README.md"
          tar -czf "release/${TAR_NAME}" ${TARGETS}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release/llm-wiki-linter-*.tar.gz'

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: 'release/llm-wiki-linter-*.tar.gz'
          if-no-files-found: error
          retention-days: 1
